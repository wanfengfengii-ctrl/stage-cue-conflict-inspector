services:
  # 发布服务：纯前端静态检视器
  web:
    build:
      context: .
      target: web
    ports:
      # 宿主机发布端口可用环境变量 WEB_PORT 覆盖，默认 8080：
      #   WEB_PORT=9000 docker compose up
      - "${WEB_PORT:-8080}:8080"

  # 一次性验收服务：构建 + Vitest + Playwright，结束即退出（退出码即验收结论）
  #   docker compose run --rm verify
  verify:
    build:
      context: .
      target: verify
    command: ["sh", "-c", "npm run build && npm run test && npx playwright test"]
    restart: "no"
